name: seo-dashboard

services:
  frontend:
    build:
      context: ./seo-dashboard-frontend
      args:
        BACKEND_URL: http://10.44.2.226:3000/api/v1/
    ports:
      - 4173:4173
    environment:
      - NODE_ENV=production
  backend:
    build: ./seo-dashboard-backend
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
  db:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - postgres-network

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - postgres-network

networks: 
  postgres-network:
    driver: bridge